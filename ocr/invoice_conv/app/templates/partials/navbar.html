<script>
    // Check authentication status when page loads
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('access_token');
        
        if (token) {
            // User is authenticated
            document.getElementById('authenticated-nav').classList.remove('d-none');
            document.getElementById('unauthenticated-nav').classList.add('d-none');
            
            // Get user info (would be implemented in a real app)
            // For demo purposes, we'll just use a placeholder
            document.getElementById('username').textContent = 'User';
        } else {
            // User is not authenticated
            document.getElementById('authenticated-nav').classList.add('d-none');
            document.getElementById('unauthenticated-nav').classList.remove('d-none');
        }
        
        // Logout function
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Clear token from local storage
            localStorage.removeItem('access_token');
            
            // Redirect to home page
            window.location.href = '/';
        });
    });
</script>
