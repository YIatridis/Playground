{% extends "base.html" %}

{% block title %}Register - InvoiceScan{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h1 class="fs-4 card-title fw-bold mb-4 text-center">Create an Account</h1>
                
                <div class="mb-4">
                    <button class="btn btn-outline-danger w-100 mb-2" id="google-register-btn">
                        <i class="fab fa-google me-2"></i> Register with Google
                    </button>
                    <div class="text-center text-muted mb-2">OR</div>
                </div>
                
                <form id="register-form">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="first_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" name="last_name" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                        <div class="form-text">Password must be at least 8 characters long.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label" for="terms">
                            I agree to the <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>
                        </label>
                    </div>
                    
                    <div class="alert alert-danger d-none" id="register-error"></div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="register-button">
                            Create Account
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer py-3 border-0">
                <div class="text-center">
                    Already have an account? <a href="/login" class="text-decoration-none">Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Handle registration form submission
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = this;
            const password = form.elements.password.value;
            const confirmPassword = form.elements.confirm_password.value;
            const errorElement = document.getElementById('register-error');
            const registerButton = document.getElementById('register-button');
            
            // Reset error message
            errorElement.classList.add('d-none');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorElement.textContent = 'Passwords do not match.';
                errorElement.classList.remove('d-none');
                return;
            }
            
            // Validate password length
            if (password.length < 8) {
                errorElement.textContent = 'Password must be at least 8 characters long.';
                errorElement.classList.remove('d-none');
                return;
            }
            
            // Disable register button and show loading state
            registerButton.disabled = true;
            registerButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Creating account...';
            
            try {
                // Call the real API for registration
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: form.elements.email.value,
                        password: password,
                        first_name: form.elements.first_name.value,
                        last_name: form.elements.last_name.value,
                    }),
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Registration failed');
                }
                
                console.log('Registration successful, logging in...');
                
                // Automatically log in the user
                const loginResponse = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': form.elements.email.value,
                        'password': password,
                    }),
                });
                
                const loginData = await loginResponse.json();
                
                if (!loginResponse.ok) {
                    throw new Error(loginData.detail || 'Login failed after registration');
                }
                
                console.log('Login successful');
                
                // Save token
                localStorage.setItem('access_token', loginData.access_token);
                
                // Redirect to dashboard
                window.location.href = '/dashboard';
                
            } catch (error) {
                // Show error message
                errorElement.textContent = error.message || 'Registration failed. Please try again.';
                errorElement.classList.remove('d-none');
                
                // Reset button
                registerButton.disabled = false;
                registerButton.textContent = 'Create Account';
            }
        });
        
        // Handle Google registration - for demo purposes, let's create a demo user
        document.getElementById('google-register-btn').addEventListener('click', async function() {
            try {
                // For demo, let's just use the regular login endpoint with a test account
                const loginResponse = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': 'demo@example.com',
                        'password': 'password',
                    }),
                });
                
                const loginData = await loginResponse.json();
                
                if (!loginResponse.ok) {
                    throw new Error(loginData.detail || 'Google login failed');
                }
                
                // Save token
                localStorage.setItem('access_token', loginData.access_token);
                
                // Redirect to dashboard
                window.location.href = '/dashboard';
            } catch (error) {
                const errorElement = document.getElementById('register-error');
                errorElement.textContent = error.message || 'Google login failed.';
                errorElement.classList.remove('d-none');
            }
        });
    });
</script>
{% endblock %}
