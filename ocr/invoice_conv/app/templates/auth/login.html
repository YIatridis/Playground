{% extends "base.html" %}

{% block title %}Login - InvoiceScan{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-5">
                <h1 class="fs-4 card-title fw-bold mb-4 text-center">Login</h1>
                
                <div class="mb-4">
                    <button class="btn btn-outline-danger w-100 mb-2" id="google-login-btn">
                        <i class="fab fa-google me-2"></i> Login with Google
                    </button>
                    <div class="text-center text-muted mb-2">OR</div>
                </div>
                
                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me">
                            <label class="form-check-label" for="remember-me">Remember me</label>
                        </div>
                        <a href="/forgot-password" class="text-decoration-none">Forgot password?</a>
                    </div>
                    
                    <div class="alert alert-danger d-none" id="login-error"></div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" id="login-button">
                            Login
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer py-3 border-0">
                <div class="text-center">
                    Don't have an account? <a href="/register" class="text-decoration-none">Register</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = this.elements.email.value;
            const password = this.elements.password.value;
            const errorElement = document.getElementById('login-error');
            const loginButton = document.getElementById('login-button');
            
            // Reset error message
            errorElement.classList.add('d-none');
            
            // Disable login button and show loading state
            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span> Logging in...';
            
            try {
                // Call the API to authenticate
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': email,
                        'password': password,
                    }),
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }
                
                console.log('Login successful');
                
                // Save token
                localStorage.setItem('access_token', data.access_token);
                
                // Redirect to dashboard
                window.location.href = '/dashboard';
                
            } catch (error) {
                // Show error message
                errorElement.textContent = error.message || 'Login failed. Please check your credentials.';
                errorElement.classList.remove('d-none');
                
                // Reset button
                loginButton.disabled = false;
                loginButton.textContent = 'Login';
            }
        });
        
        // Handle Google login - for demo purposes, let's create a demo user
        document.getElementById('google-login-btn').addEventListener('click', async function() {
            try {
                // For demo, let's just use the regular login endpoint with a test account
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'username': 'demo@example.com',
                        'password': 'password',
                    }),
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Google login failed');
                }
                
                // Save token
                localStorage.setItem('access_token', data.access_token);
                
                // Redirect to dashboard
                window.location.href = '/dashboard';
            } catch (error) {
                const errorElement = document.getElementById('login-error');
                errorElement.textContent = error.message || 'Google login failed.';
                errorElement.classList.remove('d-none');
            }
        });
    });
</script>
{% endblock %}
