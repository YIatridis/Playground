<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 24px; font-weight: bold; }
    .step-title { font-size: 16px; font-weight: bold; }
    .step-desc { font-size: 12px; }
  </style>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" class="title" fill="#333">How InvoiceScan Works</text>
  
  <!-- Step 1 -->
  <circle cx="150" cy="120" r="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="2" />
  <text x="150" y="125" text-anchor="middle" class="step-title" fill="#0d6efd">1</text>
  <text x="150" y="180" text-anchor="middle" class="step-title" fill="#333">Upload</text>
  <text x="150" y="200" text-anchor="middle" class="step-desc" fill="#6c757d">Upload your PDF invoice</text>
  
  <!-- Step 2 -->
  <circle cx="300" cy="120" r="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="2" />
  <text x="300" y="125" text-anchor="middle" class="step-title" fill="#0d6efd">2</text>
  <text x="300" y="180" text-anchor="middle" class="step-title" fill="#333">AI Processing</text>
  <text x="300" y="200" text-anchor="middle" class="step-desc" fill="#6c757d">Our AI extracts key data</text>
  
  <!-- Step 3 -->
  <circle cx="450" cy="120" r="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="2" />
  <text x="450" y="125" text-anchor="middle" class="step-title" fill="#0d6efd">3</text>
  <text x="450" y="180" text-anchor="middle" class="step-title" fill="#333">Review</text>
  <text x="450" y="200" text-anchor="middle" class="step-desc" fill="#6c757d">Verify extracted information</text>
  
  <!-- Step 4 -->
  <circle cx="300" cy="280" r="40" fill="#e9ecef" stroke="#dee2e6" stroke-width="2" />
  <text x="300" y="285" text-anchor="middle" class="step-title" fill="#0d6efd">4</text>
  <text x="300" y="340" text-anchor="middle" class="step-title" fill="#333">Export</text>
  <text x="300" y="360" text-anchor="middle" class="step-desc" fill="#6c757d">Download in your preferred format</text>
  
  <!-- Connecting lines -->
  <path d="M190 120 L260 120" stroke="#dee2e6" stroke-width="2" />
  <path d="M340 120 L410 120" stroke="#dee2e6" stroke-width="2" />
  <path d="M450 160 L450 220 L340 280" stroke="#dee2e6" stroke-width="2" fill="none" />
  <path d="M150 160 L150 220 L260 280" stroke="#dee2e6" stroke-width="2" fill="none" />
  
  <!-- Icons -->
  <path d="M150 110 L140 115 L160 115 L150 110 Z M140 120 L160 120 L160 130 L140 130 Z" fill="#0d6efd" />
  <circle cx="300" cy="110" r="10" fill="#0d6efd" />
  <path d="M445 110 L455 110 L455 120 L445 120 Z M448 113 L452 113 L452 117 L448 117 Z" fill="#0d6efd" />
  <path d="M295 275 L305 275 L305 285 L295 285 Z M295 290 L305 290 Z" fill="#0d6efd" />
</svg>